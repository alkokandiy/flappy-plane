<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#70c5ce" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Flappy Plane</title>
  <link rel="icon" type="image/png" href="assets/sprites/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <main id="stage">
    <div class="screen">
      <canvas id="game"></canvas>
      <div id="intro" class="overlay" hidden>
        <div class="scan"></div>
        <div class="badge">RETRO ARCADE</div>
        <video
          id="winVideo"
          src="assets/win.mp4"
          muted
          loop
          playsinline
          preload="auto"
        ></video>
        <img id="loseImg" src="assets/lose.png" alt="You lose" />
        <h1 class="title">FLAPPY<br />PLANE</h1>
        <div class="ready">★ GET READY ★</div>
        <div class="panel" hidden>
          <div class="row"><span>SCORE</span><strong id="finalScore">0</strong></div>
          <div class="row"><span>BEST</span><strong id="bestScore">0</strong></div>
          <div id="newBest" class="newbest" hidden>★ NEW BEST ★</div>
        </div>
        <button id="playBtn" type="button">▶ PLAY</button>
        <div class="actions">
          <button id="menuBtn" type="button" class="ghost">⌂ MENU</button>
          <button id="garageBtn" type="button" class="ghost">⚙ VEHICLES</button>
        </div>
        <div class="hint">CLICK / SPACE</div>
        <div class="socials">
          <a
            href="https://t.me/AlKokandiyStartup"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram: AlKokandiyStartup"
            title="Telegram"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
          </a>
          <a
            href="https://x.com/AlKokandiy"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="X: AlKokandiy"
            title="X"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932zM17.61 20.644h2.039L6.486 3.24H4.298z"/>
            </svg>
          </a>
        </div>
      </div>
      <div id="garage" class="overlay" hidden>
        <div class="scan"></div>
        <h2 class="garage-title">SELECT VEHICLE</h2>
        <div id="garageList" class="garage-list"></div>
        <button id="garageBack" type="button">◀ BACK</button>
      </div>
    </div>
    <div id="loading">Loading…</div>
  </main>
  <!--
    Pinned music track. Local dev auto-discovers any song in
    assets/music/, but static hosts (Vercel, etc.) have no directory
    listing, so the known track is set explicitly here. Change this
    filename when you swap songs.
  -->
  <script>window.FLAPPY_MUSIC_URL = "assets/music/newsong.ogg";</script>
  <!-- Bump ?v= after each release so browsers/Vercel drop cached files.
       (A stale cached game.js is the classic "it feels like the old
       version" bug.) -->
  <script type="module" src="js/main.js?v=13"></script>
</body>
</html>
